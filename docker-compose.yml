volumes:
  web_build:
  api_build:
  api_node_modules:
  web_node_modules:
  db_data:
  redis_data:

networks:
  default:

services:
  api:
    env_file: .env
    build:
      context: ./packages/api
    image: bobarr-api:local
    command: yarn start:prod
    restart: unless-stopped
    volumes:
      - ./library:/usr/library
    ports:
      - 4000:4000

  web:
    env_file: .env
    build:
      context: ./packages/web
    image: bobarr-web:local
    command: yarn start
    restart: unless-stopped
    ports:
      - 3000:3000

  postgres:
    image: postgres:12-alpine
    env_file: .env
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    env_file: .env
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    volumes:
      - redis_data:/data

  jackett:
    image: linuxserver/jackett
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./packages/jackett/config:/config
      - ./packages/jackett/downloads:/downloads
    ports:
      - 9117:9117

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    ports:
      - 8191:8191

  transmission:
    image: linuxserver/transmission
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./library/downloads:/downloads
      - ./packages/transmission/config:/config
      - ./packages/transmission/watch:/watch

  transmission-web:
    image: dperson/nginx
    depends_on:
      - transmission
    environment:
      - TZ=Europe/Paris
    ports:
      - "9091:80"
    command: -w "http://transmission:9091;/"
    restart: unless-stopped
